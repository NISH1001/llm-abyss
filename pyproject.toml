[project]
name = "llm-abyss"
dynamic = ["version"]
description = "Opinionated tooling around the abyss of LLMs: composable, async-first retrieval steps, servable as MCP tools."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nish" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "loguru>=0.7"]

[project.optional-dependencies]
mcp = ["mcp>=2.3", "pydantic-settings>=2.6"]

[project.scripts]
abyss-mcp = "abyss.mcp:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3.6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "abyss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["abyss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
